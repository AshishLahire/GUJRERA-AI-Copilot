[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "factcheck"
version = "0.1.0"
description = "Indian-language misinformation verification pipeline (OCR, claim extraction, forgery checks, official-source verification)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.7",
    "pillow>=10.0",
    "opencv-python-headless>=4.8",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "google-genai>=1.0",
    "pypdf>=4.0",
    "pypdfium2>=5.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "faster-whisper==1.2.1",
    "av==18.1.0",
    "jiwer==4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
ui = [
    "streamlit>=1.32",
]

[tool.setuptools.packages.find]
include = ["factcheck*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
